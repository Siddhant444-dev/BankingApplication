spring.application.name=SecureSearch Cloud
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/securesearch;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=15MB
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.jwt-secret=${JWT_SECRET:B1wq4YxSxwnyZmls9sRC+U1RE9w1JZxB8eQ9rbBqlcY=}
app.jwt-expiration=${JWT_EXPIRATION:86400000}
server.error.include-message=always
